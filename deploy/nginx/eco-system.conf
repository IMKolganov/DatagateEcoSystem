# eco-system.datagateapp.com → DatagateEcoSystem (host :5080)
# Copy into nginx-docker conf.d and reload nginx.

server {
    listen 80;
    listen [::]:80;
    server_name eco-system.datagateapp.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eco-system.datagateapp.com;

    ssl_certificate     /etc/letsencrypt/live/eco-system.datagateapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eco-system.datagateapp.com/privkey.pem;

    client_max_body_size 8m;

    location / {
        proxy_pass http://172.17.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
